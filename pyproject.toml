[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beamax"
description = "Multiscale Gaussian Beams in JAX"
version = "0.3.0"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Elliott Macneil", email = "ucabem1@ucl.ac.uk" },
  { name = "Ben Cox" },
  { name = "Marta Betcke" }
]
keywords = [
  "gaussian-beams",
  "wave-equation",
  "photoacoustic-tomography",
  "jax",
  "differentiable-programming",
  "multiscale",
  "wave-packet-transform",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "jax>=0.9,<1.0",
  "numpy>=1.26",
  "equinox>=0.13",
  "diffrax>=0.7",
  "einops>=0.8",
  "scipy>=1.11",
  "jaxtyping>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pre-commit",
  "pyright",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings-python",
]

viz-mpl = ["matplotlib>=3.7"]

kwave = ["k-wave-python>=0.6.2"]
autodiff = ["optax>=0.2"]

all = [
  "matplotlib>=3.7",
  "k-wave-python>=0.6.2",
  "optax>=0.2",
]

[project.urls]
Homepage = "https://github.com/elma16/beamax"
Documentation = "https://elma16.github.io/beamax/"
Issues = "https://github.com/elma16/beamax/issues"

[tool.setuptools.packages.find]
include = ["beamax*"]

[tool.setuptools.package-data]
beamax = ["py.typed"]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# Ruff cannot parse jaxtyping shape strings such as ``Float[Array, "b d"]``.
ignore = ["E501", "F722"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
"beamax/gb/core.py" = ["F821"]
"beamax/transforms.py" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["beamax"]
branch = true

[tool.coverage.report]
fail_under = 90
precision = 2
